<style>@font-face{font-family:"Permanent Marker";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/permanent-marker-latin-400-normal.woff2) format("woff2")}

:root{--ink:#24392A;--hand:"Caveat",cursive;--ease:cubic-bezier(.2,.8,.2,1)}*{margin:0;box-sizing:border-box}body{background:#F3EEE3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;font-family:Poppins,sans-serif}
svg#scene{width:100%;max-width:1500px;height:auto;display:block}.c{display:flex;gap:8px}.c button{font:400 12px Poppins;border:1.4px solid #24392A;background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer}.c button.on{background:#244A32;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}/* scene motion */
#kb{transform-origin:60% 55%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035) translate(-6px,-4px)}}
.halo{opacity:.35;animation:glow 3s ease-in-out infinite alternate;animation-delay:calc(var(--sd) * -1s)}@keyframes glow{from{opacity:.22}to{opacity:.5}}
#sweep{animation:sweep 8s cubic-bezier(.6,0,.3,1) infinite 2.5s}@keyframes sweep{0%{transform:skewX(-18deg) translateX(0)}55%,100%{transform:skewX(-18deg) translateX(1400px)}}
.dap{animation:dap 7s ease-in-out infinite alternate;animation-delay:calc(var(--sd) * -1s)}@keyframes dap{from{transform:translate(-12px,-2px)}to{transform:translate(14px,3px)}}
.fall>g{animation:fall 12s linear infinite;animation-delay:calc(var(--sd) + 2.5s);opacity:0}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:1}50%{transform:translate(var(--fx),300px) rotate(260deg)}90%{opacity:1}100%{opacity:0;transform:translate(calc(var(--fx) * -.4),700px) rotate(540deg)}}
.bird{offset-path:path("M1560 120C1300 60 1000 140 620 40");animation:fly 22s linear infinite;animation-delay:var(--sd);opacity:0}
@keyframes fly{0%{offset-distance:0;opacity:0}6%{opacity:1}80%{opacity:1}100%{offset-distance:100%;opacity:0}}
.wing{animation:flap .5s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}@keyframes flap{to{transform:scaleY(-.6)}}
.sun{transform-origin:var(--o);transform-box:view-box;animation:spin 30s linear infinite}
.dd{stroke-dasharray:1;stroke-dashoffset:1}
.go .dd{animation:draw 1.2s var(--ease) forwards}
.go #doodles>*:nth-child(n){animation-delay:2.2s}
@keyframes draw{to{stroke-dashoffset:0}}
.hn{font-family:var(--hand);font-weight:600;fill:var(--ink);opacity:0;paint-order:stroke;stroke:#F3EEE3;stroke-width:6px;stroke-linejoin:round}
.go .hn{animation:fadeup 1s var(--ease) forwards 2.6s}@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.go .dd{animation-delay:2.2s}.go #doodles .dd:nth-of-type(3n){animation-delay:2.6s}.go #doodles .dd:nth-of-type(3n+1){animation-delay:3s}
.steam{stroke-dasharray:4 6;animation:steam 2.4s linear infinite;animation-delay:var(--sd);opacity:.8}@keyframes steam{from{stroke-dashoffset:0;transform:translateY(0);opacity:.8}to{stroke-dashoffset:-20;transform:translateY(-6px);opacity:0}}
.heart{opacity:0;transform-box:fill-box;transform-origin:center;animation:heart 5s ease-out infinite;animation-delay:calc(var(--sd) + 3.5s)}
@keyframes heart{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.95;transform:translate(0,-10px) scale(1)}100%{opacity:0;transform:translate(var(--hx),-90px) scale(.8)}}
.dusk #dusk{opacity:.1;transition:opacity 1.6s}#dusk{transition:opacity 1.6s}.dusk #halos2{opacity:1;transition:opacity 1.6s}#halos2{transition:opacity 1.6s}
.paused *{animation-play-state:paused!important}
.reveal{clip-path:inset(0 0 0 100%);animation:wipe 1.6s cubic-bezier(.7,0,.2,1) forwards .2s}@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
